<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- P letter mark -->
  <rect x="14" y="14" width="6" height="36" rx="3" fill="url(#grad)"/>
  <rect x="14" y="14" width="22" height="6" rx="3" fill="url(#grad)"/>
  <rect x="14" y="29" width="20" height="6" rx="3" fill="url(#grad)"/>
  <rect x="30" y="14" width="6" height="21" rx="3" fill="url(#grad)"/>

  <!-- Spark dot -->
  <circle cx="48" cy="18" r="4" fill="#6366F1" opacity="0.9"/>
  <circle cx="48" cy="18" r="2" fill="white"/>
</svg>
